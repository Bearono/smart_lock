<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <title>门锁演示 · 安居</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/panel.css" />
    <script src="/static/panel.js" defer></script>
  </head>
  <body data-state="UNKNOWN" data-connection="connecting">
    <div class="app" id="app">
      <header class="topbar">
        <a class="brand" href="/panel" aria-label="安居门锁演示">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 20V5.5L17 3v17M4 20h16M13.5 12h.01" />
            </svg>
          </span>
          <span>
            安居
            <span class="brand-separator" aria-hidden="true">/</span>
            <span class="brand-section">门锁演示</span>
          </span>
        </a>
        <div class="toolbar">
          <span class="simulation-tag">
            模拟门锁
            <span id="architecture" hidden></span>
          </span>
          <button class="glass-button" id="fullscreen-toggle" type="button" aria-label="全屏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4" />
            </svg>
            <span id="fullscreen-label">全屏</span>
          </button>
        </div>
      </header>

      <main class="dashboard">
        <section class="door-card" aria-labelledby="status-title">
          <div class="state-heading" aria-live="polite" aria-atomic="true">
            <div class="state-symbol" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path class="shackle" d="M10 14V9a6 6 0 0 1 12 0v5" />
                <rect x="7" y="14" width="18" height="15" rx="4" />
                <path d="M16 20v3" />
              </svg>
            </div>
            <div>
              <p class="eyebrow">锁舌状态</p>
              <h1 id="status-title">正在连接</h1>
              <p class="state-detail" id="status-detail">等待模拟服务</p>
            </div>
            <span class="fault-tag" id="fault-tag" hidden></span>
          </div>

          <div class="door-stage">
            <svg
              class="door-illustration"
              viewBox="0 0 800 620"
              role="img"
              aria-labelledby="door-title door-description"
            >
              <title id="door-title">模拟门锁与锁舌</title>
              <desc id="door-description">锁舌随模拟服务的状态伸出或收回；门扇保持静止。</desc>
              <defs>
                <linearGradient id="wall" x1="0" x2="1" y2="1">
                  <stop stop-color="#eae8e1" />
                  <stop offset="1" stop-color="#f8f7f3" />
                </linearGradient>
                <linearGradient id="door-surface" x1="0" x2="1" y2="0.25">
                  <stop stop-color="#d9d5ca" />
                  <stop offset="0.42" stop-color="#eeeae0" />
                  <stop offset="1" stop-color="#e6e1d5" />
                </linearGradient>
                <linearGradient id="frame" x1="0" x2="1">
                  <stop stop-color="#bab7ad" />
                  <stop offset="0.2" stop-color="#e1ded4" />
                  <stop offset="1" stop-color="#d3d0c7" />
                </linearGradient>
                <linearGradient id="lock-metal" x1="0" x2="1">
                  <stop stop-color="#505962" />
                  <stop offset="0.45" stop-color="#343e49" />
                  <stop offset="1" stop-color="#1e2831" />
                </linearGradient>
                <linearGradient id="bolt-metal" x1="0" x2="0" y2="1">
                  <stop stop-color="#eef2f6" />
                  <stop offset="0.24" stop-color="#aebbc7" />
                  <stop offset="0.48" stop-color="#d5dde4" />
                  <stop offset="1" stop-color="#8595a4" />
                </linearGradient>
                <linearGradient id="cutaway" x1="0" x2="1" y2="1">
                  <stop stop-color="#fdfdfc" />
                  <stop offset="1" stop-color="#e9edf1" />
                </linearGradient>
                <radialGradient id="stage-wash">
                  <stop stop-color="#ddd7ca" stop-opacity="0.36" />
                  <stop offset="1" stop-color="#ddd7ca" stop-opacity="0" />
                </radialGradient>
                <filter id="door-shadow" x="-40%" y="-20%" width="180%" height="160%">
                  <feDropShadow
                    dx="14"
                    dy="18"
                    stdDeviation="18"
                    flood-color="#30343a"
                    flood-opacity="0.1"
                  />
                </filter>
                <filter id="detail-shadow" x="-30%" y="-30%" width="160%" height="180%">
                  <feDropShadow
                    dx="0"
                    dy="14"
                    stdDeviation="18"
                    flood-color="#263749"
                    flood-opacity="0.13"
                  />
                </filter>
                <clipPath id="cutaway-clip">
                  <rect x="520" y="289" width="225" height="160" rx="24" />
                </clipPath>
                <clipPath id="bolt-travel">
                  <rect x="610" y="331" width="76" height="70" />
                </clipPath>
              </defs>
              <ellipse cx="365" cy="330" rx="360" ry="285" fill="url(#stage-wash)" />
              <path d="M85 535h635" stroke="#dbd9d2" stroke-width="1" />
              <ellipse cx="344" cy="538" rx="204" ry="14" fill="#615d54" opacity="0.08" />
              <g filter="url(#door-shadow)">
                <path d="M180 70h314l15 13v449H180Z" fill="url(#wall)" />
                <path d="M199 88h287v444H199Z" fill="url(#frame)" />
                <path d="M215 100h255v432H215Z" fill="#aaa99f" />
                <path d="M222 106h238v426H222Z" fill="url(#door-surface)" />
                <path d="M228 112h225v414H228Z" fill="none" stroke="#f9f7ef" stroke-opacity="0.6" />
                <path d="M246 130h188v378H246Z" fill="none" stroke="#bcb6a8" stroke-opacity="0.3" />
                <path d="M248 132h186" stroke="#faf8f0" stroke-opacity="0.65" />
                <circle cx="340" cy="204" r="5" fill="#b6b0a3" />
                <circle cx="340" cy="204" r="2" fill="#5c6060" />
                <rect
                  x="412"
                  y="291"
                  width="31"
                  height="127"
                  rx="13"
                  fill="#6b6e6c"
                  opacity="0.18"
                  transform="translate(3 3)"
                />
                <rect x="412" y="291" width="31" height="127" rx="13" fill="url(#lock-metal)" />
                <path d="M419 298h16" stroke="#aab5be" stroke-opacity="0.45" />
                <rect class="lock-indicator" x="423" y="309" width="9" height="3" rx="1.5" />
                <circle
                  cx="428"
                  cy="351"
                  r="9"
                  fill="#202c36"
                  stroke="#788591"
                  stroke-width="0.8"
                />
                <path
                  d="M429 348h-47a4 4 0 0 0-4 4v2a3 3 0 0 0 3 3h48a4.5 4.5 0 0 0 0-9Z"
                  fill="url(#lock-metal)"
                  stroke="#687782"
                  stroke-width="0.6"
                />
                <circle
                  cx="428"
                  cy="392"
                  r="4"
                  fill="#111f2c"
                  stroke="#687682"
                  stroke-width="0.8"
                />
              </g>
              <path
                class="detail-leader"
                d="M445 352h29l43 17"
                fill="none"
                stroke="#7d8b98"
                stroke-width="1.3"
                stroke-dasharray="3 5"
              />
              <circle cx="446" cy="352" r="3" fill="#7d8b98" />
              <g filter="url(#detail-shadow)">
                <rect
                  x="520"
                  y="289"
                  width="225"
                  height="160"
                  rx="24"
                  fill="url(#cutaway)"
                  stroke="white"
                  stroke-width="2"
                />
              </g>
              <g clip-path="url(#cutaway-clip)">
                <path d="M671 289v160" stroke="#d4d9df" stroke-width="28" />
                <path d="M657 289v160" stroke="#f9fafc" stroke-width="2" />
                <rect x="654" y="344" width="29" height="44" rx="6" fill="#8593a1" />
                <rect x="661" y="350" width="22" height="32" rx="3" fill="#384b5a" />
                <rect
                  x="550"
                  y="331"
                  width="87"
                  height="70"
                  rx="12"
                  fill="#d8dfe5"
                  stroke="#c2cbd4"
                />
                <g clip-path="url(#bolt-travel)">
                  <g id="bolt">
                    <rect
                      x="593"
                      y="351"
                      width="79"
                      height="30"
                      rx="5"
                      fill="url(#bolt-metal)"
                      stroke="#8392a0"
                      stroke-width="0.7"
                    />
                    <path d="M598 355h67" stroke="#fff" stroke-opacity="0.8" />
                  </g>
                </g>
                <rect x="546" y="331" width="64" height="70" rx="12" fill="url(#lock-metal)" />
                <path d="M555 337h41M555 395h41" stroke="#788896" stroke-opacity="0.45" />
                <circle cx="578" cy="366" r="13" fill="#202d38" stroke="#657584" />
                <path
                  class="bolt-dial"
                  d="M578 358v16"
                  stroke="#bdc9d3"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <circle class="lock-indicator" cx="701" cy="366" r="5" />
              </g>
              <text class="diagram-label" x="632" y="481" text-anchor="middle">锁舌</text>
            </svg>
            <div class="authorization-help" id="authorization-help" hidden>
              <div class="authorization-content">
                <h2>从本机打开演示面板</h2>
                <p>在项目目录运行：</p>
                <code>python deploy/simulated_lock.py panel</code>
              </div>
            </div>
          </div>

          <footer class="connection-bar">
            <span class="connection">
              <span class="connection-dot" aria-hidden="true"></span>
              <span id="connection-label">连接中</span>
            </span>
            <span class="received-at" id="received-at">尚未接收状态</span>
          </footer>
        </section>

        <aside class="activity-column">
          <section class="latest-card" aria-labelledby="latest-heading">
            <div class="section-heading">
              <h2 id="latest-heading">最近执行</h2>
              <span class="result-indicator" id="latest-indicator" aria-hidden="true"></span>
            </div>
            <div id="latest-content" hidden>
              <p class="latest-result" id="latest-result">—</p>
              <div class="latest-meta">
                <span id="latest-target"></span>
                <time id="latest-time"></time>
              </div>
              <div class="command-reference">
                <span>命令</span>
                <code id="latest-id"></code>
              </div>
            </div>
            <div class="empty-latest" id="latest-empty">
              <span class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M8 5h8m-9 0H5v16h14V5h-2M9 3h6v4H9ZM8 12h8M8 16h5" />
                </svg>
              </span>
              <p>等待第一条命令</p>
            </div>
          </section>

          <section class="history-card" aria-labelledby="history-heading">
            <div class="section-heading">
              <h2 id="history-heading">执行记录</h2>
              <span class="history-count" id="history-count">0</span>
            </div>
            <ol class="history" id="history"></ol>
            <p class="empty-history" id="history-empty">暂无记录</p>
          </section>
        </aside>
      </main>
      <p class="screenreader-only" id="screenreader-announcement" role="status"></p>
    </div>
  </body>
</html>
