# Enable after issuing a certificate whose SAN matches the Pi service address.
services:
  device-tls:
    image: nginx:stable-alpine
    ports: ['${DEVICE_TLS_BIND_IP:?Set Pi LAN bind address}:8443:8443']
    volumes:
      - ./deploy/nginx.device.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/device.crt:/etc/smartlock-tls/device.crt:ro
      - ./deploy/tls/device.key:/etc/smartlock-tls/device.key:ro
    depends_on:
      device: {condition: service_healthy}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && nginx -t']
      interval: 30s
      timeout: 5s
      retries: 3
