server {
    listen 8443 ssl;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $device_origin http://device:5000;
    server_tokens off;
    ssl_certificate /etc/smartlock-tls/device.crt;
    ssl_certificate_key /etc/smartlock-tls/device.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 64k;
    location / {
        proxy_pass $device_origin;
        proxy_set_header Host $host;
        proxy_read_timeout 25s;
    }
}
