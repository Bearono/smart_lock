server {
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate /etc/smartlock-tls/device.crt;
    ssl_certificate_key /etc/smartlock-tls/device.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 64k;
    location / {
        proxy_pass http://device:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 25s;
    }
}
