limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
    listen 8443 ssl;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $backend_origin http://backend:8000;
    set $web_origin http://web:8080;
    server_tokens off;
    ssl_certificate /etc/smartlock-tls/server.crt;
    ssl_certificate_key /etc/smartlock-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_tickets off;
    # Emit one authoritative value rather than duplicating upstream security headers.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    client_max_body_size 8m;
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $backend_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }
    location /health/ {
        proxy_pass $backend_origin;
    }
    location / {
        proxy_pass $web_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }
}
