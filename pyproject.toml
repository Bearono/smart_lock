[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["outputs", "releases", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"

# Tests explicitly add isolated component roots before importing their applications.
[tool.ruff.lint.per-file-ignores]
"apps/api/tests/*.py" = ["E402"]
"apps/device/tests/*.py" = ["E402"]
