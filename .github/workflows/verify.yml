name: Verify delivery candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python deploy/check_repository.py
      - run: pip install -r apps/api/requirements.txt
      - run: pip install --no-deps ./packages/smartlock_protocol
      - run: pip install numpy==2.2.4
      - run: python deploy/audit_dependencies.py --output /tmp/dependency-audit.json
      - run: python -B -m unittest discover -s apps/api/tests -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          npm run serve -- --port 5173 > /tmp/smartlock-vite.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<100;i++){try{if((await fetch('http://127.0.0.1:5173')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,250))}process.exit(1)"
          npm run test:browser
          npm run test:material
          npm run test:device-console
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-browser-screenshots
          path: apps/web/test-artifacts/*.png
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.4
      - name: Fetch pinned JVM test dependencies
        run: |
          mkdir -p apps/android/.tools
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o apps/android/.tools/junit-4.13.2.jar
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o apps/android/.tools/hamcrest-core-1.3.jar
          sha256sum --check <<'HASHES'
          8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  apps/android/.tools/junit-4.13.2.jar
          66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  apps/android/.tools/hamcrest-core-1.3.jar
          HASHES
      - run: python apps/android/test_jvm.py --jdk "$JAVA_HOME_17_X64"
      - run: python apps/android/tests/test_codec_interop.py --java "$JAVA_HOME_17_X64/bin/java"
      - name: Build and verify debug APK
        run: python apps/android/build_sdk.py --jdk "$JAVA_HOME_17_X64" --sdk "$ANDROID_HOME"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 deploy/init_secrets.py
      - run: python3 -m pip install cryptography==50.0.1
      - run: python3 deploy/init_local_tls.py
      - run: docker compose -f compose.yaml -f compose.tls.yaml build
      - run: docker compose -f compose.yaml -f compose.tls.yaml up -d --wait
      - run: curl --fail http://127.0.0.1:8080/health/ready
      - run: curl --fail --cacert deploy/tls/ca.crt https://localhost:8443/health/ready
      - if: always()
        run: docker compose -f compose.yaml -f compose.tls.yaml logs --tail=100
      - if: always()
        run: docker compose -f compose.yaml -f compose.tls.yaml down
  device-image:
    name: device-image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f deploy/device.Dockerfile -t smart-lock-device:ci .
      - name: Verify native image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(docker image inspect smart-lock-device:ci --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
      - run: docker run --rm --network none --read-only --tmpfs /tmp smart-lock-device:ci python /app/device_smoke.py
      - run: docker run --rm --network none --read-only --tmpfs /tmp smart-lock-device:ci python -B -m unittest discover -s /app/tests -v
