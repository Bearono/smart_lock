# Optional TLS entry point. Existing localhost HTTP preview remains available.
services:
  backend:
    environment:
      REQUESTS_CA_BUNDLE: /etc/smartlock-ca/ca.crt
    volumes:
      - ./deploy/tls/ca.crt:/etc/smartlock-ca/ca.crt:ro
  tls:
    image: nginx:stable-alpine
    ports: ['${SMART_LOCK_TLS_BIND_IP:-127.0.0.1}:${SMART_LOCK_TLS_PORT:-8443}:8443']
    volumes:
      - ./deploy/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/server.crt:/etc/smartlock-tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/smartlock-tls/server.key:ro
    depends_on:
      web: {condition: service_healthy}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && nginx -t']
      interval: 15s
      timeout: 5s
      retries: 3
